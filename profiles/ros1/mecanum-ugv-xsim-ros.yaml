schema: xgc.robot.adapter-profile/v4
profile_id: mecanum-ugv.xsim.ros
profile_version: 1
native_protocol: ros1
robot_kind: mecanum_ugv
description: mecanum_ugv direct xsim pose/twist observation and original native telemetry/control.
parameters:
  ros_master_uri:
    type: string
    required: false
    delivery: target_binding
    description: Experiment ROS master URI.
  ros_ip:
    type: string
    required: false
    delivery: target_binding
    description: ROS address of this Adapter host.
  namespace:
    type: string
    required: true
    delivery: target_binding
    description: Product-owned ROS namespace assigned to this Mecanum UGV.
  positioning_frame_number:
    type: integer
    required: true
    delivery: target_binding
    description: XGC1-compatible repeat-frame window length owned by the Robot asset.
  positioning_comparison_threshold_m:
    type: number
    required: true
    delivery: target_binding
    description: XGC1-compatible per-axis root-sum-square pose-change threshold in metres.
  localization_pose_topic:
    type: string
    required: true
    delivery: target_binding
    description: Resolved direct xsim pose topic; defaults to the slot namespace.
  localization_twist_topic:
    type: string
    required: true
    delivery: target_binding
    description: Resolved direct xsim twist topic; defaults to the slot namespace.
semantic_traits:
  default_stale_after_ms: 2000
  channel_stale_after_ms:
    vrpn.position: 1000
    vrpn.velocity: 1000
    vrpn.speed: 1000
    state.imu: 1000
    command.velocity: 1000
    state.power: 5000
    state.health: 2000
    state.controller: 2000
  online_conditions:
  - channel_id: state.imu
    maximum_age_ms: 1000
  operational_ready_conditions:
  - channel_id: vrpn.position
    maximum_age_ms: 1000
channels:
- id: vrpn.position
  kind: stream_out
  output_message_id: 2001
  processor: mecanum-ugv.vrpn-pose
  output_rate_hz: 10
  inputs:
    pose:
      name: '{localization_pose_topic}'
      type: geometry_msgs/PoseStamped
      scope: global
  policy:
    apply_world_offset: false
- id: vrpn.velocity
  kind: stream_out
  output_message_id: 2002
  processor: mecanum-ugv.vrpn-velocity
  output_rate_hz: 10
  inputs:
    velocity:
      name: '{localization_twist_topic}'
      type: geometry_msgs/TwistStamped
      scope: global
- id: vrpn.speed
  kind: stream_out
  output_message_id: 2006
  processor: mecanum-ugv.vrpn-speed
  output_rate_hz: 10
  inputs:
    pose:
      name: '{localization_pose_topic}'
      type: geometry_msgs/PoseStamped
      scope: global
    velocity:
      name: '{localization_twist_topic}'
      type: geometry_msgs/TwistStamped
      scope: global
- id: command.velocity
  kind: stream_out
  output_message_id: 2002
  processor: mecanum-ugv.velocity-command-observation
  output_rate_hz: 10
  inputs:
    command:
      name: cmd_vel
      type: geometry_msgs/Twist
- id: state.imu
  kind: stream_out
  output_message_id: 2003
  processor: mecanum-ugv.imu-estimate
  output_rate_hz: 10
  inputs:
    imu:
      name: imu
      type: sensor_msgs/Imu
- id: state.power
  kind: stream_out
  output_message_id: 2004
  processor: mecanum-ugv.power-status
  output_rate_hz: 1
  inputs:
    battery:
      name: PowerVoltage
      type: std_msgs/Float32
  policy:
    battery_voltage_percentage_curve:
    - 10.5=0.0
    - 12.6=1.0
- id: state.health
  kind: stream_out
  output_message_id: 2005
  processor: mecanum-ugv.vehicle-health
  output_rate_hz: 1
  observes:
  - vrpn.position
  - vrpn.velocity
  - state.imu
- id: state.controller
  kind: stream_out
  output_message_id: 2012
  processor: mecanum-ugv.controller-status
  output_rate_hz: 5
  inputs:
    status:
      name: custom/statustext
      type: std_msgs/String
- id: operation.motion-intent
  kind: operation
  operation_id: set-motion-intent
  input_message_id: 3205
  output_message_id: 1
  processor: mecanum-ugv.set-motion-intent
  operation_contract:
    side_effect: idempotent
    idempotency: required
    cancellation_supported: false
    deadline_required: true
  output:
    name: cmd_vel
    type: geometry_msgs/Twist
  policy:
    timeout_ms: 1000
- id: operation.motion-intent-release
  kind: operation
  operation_id: release-motion-intent
  input_message_id: 3205
  output_message_id: 1
  processor: mecanum-ugv.release-motion-intent
  operation_contract:
    side_effect: idempotent
    idempotency: required
    cancellation_supported: false
    deadline_required: true
  output:
    name: cmd_vel
    type: geometry_msgs/Twist
  policy:
    timeout_ms: 1000
- id: diagnostic.stream-health
  kind: stream_out
  output_message_id: 2011
  processor: common.stream-health-report
  output_rate_hz: 10
  observes:
  - vrpn.position
  - vrpn.velocity
  - vrpn.speed
  - state.imu
  - command.velocity
  - state.power
  - state.controller
