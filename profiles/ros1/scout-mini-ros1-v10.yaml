schema: xgc.robot.adapter-profile/v4
profile_id: scout-mini.ros1.v10
profile_version: 10
native_protocol: ros1
robot_kind: scout_mini
description: Scout Mini raw mocap projection, chassis, IMU, command telemetry, and discrete motion control. Online follows the on-board IMU; Adapter localization gates operational readiness.
parameters:
  namespace:
    type: string
    required: true
    delivery: target_binding
    description: Product-owned ROS namespace assigned to this Scout Mini robot.
  mocap_rigid_body:
    type: string
    required: true
    delivery: target_binding
    pattern: ^[A-Za-z][A-Za-z0-9_]*$
    description: Trusted VRPN tracker name assigned to this Scout Mini robot.
  mocap_source_root:
    type: string
    required: false
    delivery: target_binding
    description: Run-frozen raw VRPN source root injected by Robot runtime.
  localization_offset_x:
    type: number
    required: false
    delivery: target_binding
    description: Run-frozen Experiment world X translation injected by Robot runtime.
  localization_offset_y:
    type: number
    required: false
    delivery: target_binding
    description: Run-frozen Experiment world Y translation injected by Robot runtime.
  localization_offset_z:
    type: number
    required: false
    delivery: target_binding
    description: Run-frozen Experiment world Z translation injected by Robot runtime.
  positioning_frame_number:
    type: integer
    required: true
    delivery: target_binding
    description: XGC1-compatible repeat-frame window length owned by the Robot asset.
  positioning_comparison_threshold_m:
    type: number
    required: true
    delivery: target_binding
    description: XGC1-compatible per-axis root-sum-square pose-change threshold in metres.
semantic_traits:
  default_stale_after_ms: 2000
  channel_stale_after_ms:
    vrpn.position: 1000
    vrpn.velocity: 1000
    vrpn.acceleration: 1000
    vrpn.speed: 1000
    state.imu: 1000
    state.power: 5000
    state.health: 2000
    state.chassis: 2000
  online_conditions:
    - channel_id: state.imu
      maximum_age_ms: 1000
  operational_ready_conditions:
    - channel_id: vrpn.position
      maximum_age_ms: 1000
channels:
  - id: vrpn.position
    kind: stream_out
    output_message_id: 2001
    processor: scout-mini.vrpn-pose
    output_rate_hz: 10
    inputs:
      pose:
        name: "{mocap_rigid_body}/pose"
        type: geometry_msgs/PoseStamped
        scope: global
    output:
      name: pose
      type: geometry_msgs/PoseStamped

  - id: command.velocity
    kind: stream_out
    output_message_id: 2002
    processor: scout-mini.velocity-command-observation
    output_rate_hz: 10
    inputs:
      command:
        name: cmd_vel
        type: geometry_msgs/Twist

  - id: operation.motion-intent
    kind: operation
    operation_id: set-motion-intent
    input_message_id: 3205
    output_message_id: 1
    processor: scout-mini.set-motion-intent
    operation_contract:
      side_effect: idempotent
      idempotency: required
      cancellation_supported: false
      deadline_required: true
    output:
      name: cmd_vel
      type: geometry_msgs/Twist
    policy:
      timeout_ms: 1000

  - id: vrpn.velocity
    kind: stream_out
    output_message_id: 2002
    processor: scout-mini.vrpn-velocity
    output_rate_hz: 10
    inputs:
      velocity:
        name: "{mocap_rigid_body}/twist"
        type: geometry_msgs/TwistStamped
        scope: global
    output:
      name: twist
      type: geometry_msgs/TwistStamped

  - id: vrpn.acceleration
    kind: stream_out
    output_message_id: 2008
    processor: scout-mini.vrpn-acceleration
    output_rate_hz: 10
    inputs:
      acceleration:
        name: "{mocap_rigid_body}/accel"
        type: geometry_msgs/AccelStamped
        scope: global
    output:
      name: accel
      type: geometry_msgs/AccelStamped

  - id: vrpn.speed
    kind: stream_out
    output_message_id: 2006
    processor: scout-mini.vrpn-speed
    output_rate_hz: 10
    inputs:
      pose:
        name: "{mocap_rigid_body}/pose"
        type: geometry_msgs/PoseStamped
        scope: global
      velocity:
        name: "{mocap_rigid_body}/twist"
        type: geometry_msgs/TwistStamped
        scope: global

  - id: state.imu
    kind: stream_out
    output_message_id: 2003
    processor: scout-mini.imu-estimate
    output_rate_hz: 10
    inputs:
      imu:
        name: imu/data_raw
        type: sensor_msgs/Imu

  - id: state.power
    kind: stream_out
    output_message_id: 2004
    processor: scout-mini.power-status
    output_rate_hz: 1
    inputs:
      battery:
        name: PowerVoltage
        type: std_msgs/Float32
    policy:
      battery_voltage_percentage_curve:
        - "24.5=0.0"
        - "29.4=1.0"

  - id: state.health
    kind: stream_out
    output_message_id: 2005
    processor: scout-mini.vehicle-health
    output_rate_hz: 1
    inputs:
      chassis_state:
        name: scout/chassis_state
        type: std_msgs/UInt32
    observes:
      - vrpn.position
      - vrpn.velocity
      - state.imu
  - id: state.chassis
    kind: stream_out
    output_message_id: 3102
    processor: scout-mini.chassis-status
    output_rate_hz: 1
    inputs:
      chassis_state:
        name: scout/chassis_state
        type: std_msgs/UInt32

  - id: diagnostic.stream-health
    kind: stream_out
    output_message_id: 2011
    processor: common.stream-health-report
    output_rate_hz: 1
    observes:
      - vrpn.position
      - vrpn.velocity
      - vrpn.acceleration
      - vrpn.speed
      - command.velocity
      - state.imu
      - state.power
      - state.health
      - state.chassis
