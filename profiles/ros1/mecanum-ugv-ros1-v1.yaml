schema: xgc.robot.adapter-profile/v5
profile_id: mecanum-ugv.ros1.v1
profile_version: 1
native_protocol: ros1
robot_kind: mecanum_ugv
description: Mecanum UGV VRPN pose, raw velocity, signed body-X speed, command observation, and leased motion control.
parameters:
  namespace:
    type: string
    required: true
    delivery: target_binding
    description: Product-owned ROS namespace assigned to this Mecanum UGV.
  mocap_rigid_body:
    type: string
    required: true
    delivery: target_binding
    pattern: ^[A-Za-z][A-Za-z0-9_]*$
    description: Trusted VRPN tracker name assigned to this Mecanum UGV.
semantic_traits:
  default_stale_after_ms: 2000
  channel_stale_after_ms:
    vrpn.position: 1000
    vrpn.velocity: 1000
    vrpn.speed: 1000
    command.velocity: 1000
  online_conditions:
    - channel_id: vrpn.position
      maximum_age_ms: 1000
  operational_ready_conditions: []
channels:
  - id: vrpn.position
    kind: stream_out
    output_message_id: 2001
    processor: mecanum-ugv.vrpn-pose
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global

  - id: vrpn.velocity
    kind: stream_out
    output_message_id: 2002
    processor: mecanum-ugv.vrpn-velocity
    output_rate_hz: 10
    inputs:
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: vrpn.speed
    kind: stream_out
    output_message_id: 2006
    processor: mecanum-ugv.vrpn-speed
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: command.velocity
    kind: stream_out
    output_message_id: 2002
    processor: mecanum-ugv.velocity-command-observation
    output_rate_hz: 10
    inputs:
      command:
        name: cmd_vel
        type: geometry_msgs/Twist

  - id: operation.motion-intent
    kind: operation
    operation_id: set-motion-intent
    input_message_id: 3204
    output_message_id: 1
    processor: mecanum-ugv.set-motion-intent
    operation_contract:
      side_effect: idempotent
      idempotency: required
      cancellation_supported: true
      deadline_required: true
    lease:
      pulse_endpoint_id: pulse-motion-intent-lease
      heartbeat_interval_ms: 250
      timeout_ms: 750
      inactive_parameter_values:
        longitudinal: 0
        yaw: 0
      volatile_supported: true
    output:
      name: cmd_vel
      type: geometry_msgs/Twist
    policy:
      timeout_ms: 1000

  - id: diagnostic.channel-health
    kind: stream_out
    output_message_id: 2010
    processor: common.channel-health
    output_rate_hz: 10
    observes:
      - vrpn.position
      - vrpn.velocity
      - vrpn.speed
      - command.velocity
