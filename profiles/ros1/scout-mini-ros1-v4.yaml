schema: xgc.robot.adapter-profile/v4
profile_id: scout-mini.ros1.v4
profile_version: 4
native_protocol: ros1
robot_kind: scout_mini
description: Scout Mini VRPN, chassis, IMU, command telemetry, and discrete motion control.
parameters:
  namespace:
    type: string
    required: true
    delivery: target_binding
    description: Product-owned ROS namespace assigned to this Scout Mini robot.
  mocap_rigid_body:
    type: string
    required: true
    delivery: target_binding
    pattern: ^[A-Za-z][A-Za-z0-9_]*$
    description: Trusted VRPN tracker name assigned to this Scout Mini robot.
semantic_traits:
  default_stale_after_ms: 2000
  channel_stale_after_ms:
    vrpn.position: 1000
    vrpn.velocity: 1000
    vrpn.speed: 1000
    state.power: 1000
    state.health: 1000
    state.chassis: 1000
  online_conditions:
    - channel_id: vrpn.position
      maximum_age_ms: 1000
    - channel_id: state.health
      maximum_age_ms: 1000
      predicate: xgc.semantic.common.vehicle-health.online
  operational_ready_conditions: []
channels:
  - id: vrpn.position
    kind: stream_out
    output_message_id: 2001
    processor: scout-mini.vrpn-pose
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global

  - id: command.velocity
    kind: stream_out
    output_message_id: 2002
    processor: scout-mini.velocity-command-observation
    output_rate_hz: 10
    inputs:
      command:
        name: cmd_vel
        type: geometry_msgs/Twist

  - id: operation.motion-intent
    kind: operation
    operation_id: set-motion-intent
    input_message_id: 3204
    output_message_id: 1
    processor: scout-mini.set-motion-intent
    operation_contract:
      side_effect: idempotent
      idempotency: required
      cancellation_supported: false
      deadline_required: true
    output:
      name: cmd_vel
      type: geometry_msgs/Twist
    policy:
      timeout_ms: 1000

  - id: vrpn.velocity
    kind: stream_out
    output_message_id: 2002
    processor: scout-mini.vrpn-velocity
    output_rate_hz: 10
    inputs:
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: vrpn.speed
    kind: stream_out
    output_message_id: 2006
    processor: scout-mini.vrpn-speed
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: state.imu
    kind: stream_out
    output_message_id: 2003
    processor: scout-mini.imu-estimate
    output_rate_hz: 10
    inputs:
      imu:
        name: imu/data_raw
        type: sensor_msgs/Imu

  - id: state.power
    kind: stream_out
    output_message_id: 2004
    processor: scout-mini.power-status
    output_rate_hz: 2
    inputs:
      chassis_status:
        name: scout_status
        type: scout_msgs/ScoutStatus

  - id: state.health
    kind: stream_out
    output_message_id: 2005
    processor: scout-mini.vehicle-health
    output_rate_hz: 2
    inputs:
      chassis_status:
        name: scout_status
        type: scout_msgs/ScoutStatus

  - id: state.chassis
    kind: stream_out
    output_message_id: 3102
    processor: scout-mini.chassis-status
    output_rate_hz: 2
    inputs:
      chassis_status:
        name: scout_status
        type: scout_msgs/ScoutStatus

  - id: diagnostic.channel-health
    kind: stream_out
    output_message_id: 2010
    processor: common.channel-health
    output_rate_hz: 1
    observes:
      - vrpn.position
      - vrpn.velocity
      - vrpn.speed
      - command.velocity
      - state.imu
      - state.power
      - state.health
      - state.chassis
