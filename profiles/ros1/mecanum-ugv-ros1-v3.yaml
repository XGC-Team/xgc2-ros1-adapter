schema: xgc.robot.adapter-profile/v4
profile_id: mecanum-ugv.ros1.v3
profile_version: 3
native_protocol: ros1
robot_kind: mecanum_ugv
description: Mecanum UGV VRPN pose, raw velocity, signed body-X speed, on-board IMU, command observation, and motion control. Online follows the on-board IMU; VRPN localization gates operational readiness.
parameters:
  namespace:
    type: string
    required: true
    delivery: target_binding
    description: Product-owned ROS namespace assigned to this Mecanum UGV.
  mocap_rigid_body:
    type: string
    required: true
    delivery: target_binding
    pattern: ^[A-Za-z][A-Za-z0-9_]*$
    description: Trusted VRPN tracker name assigned to this Mecanum UGV.
semantic_traits:
  default_stale_after_ms: 2000
  channel_stale_after_ms:
    vrpn.position: 1000
    vrpn.velocity: 1000
    vrpn.speed: 1000
    state.imu: 1000
    command.velocity: 1000
  # Same contract as the Scout Mini: online is the vehicle's own liveness and
  # localization is a separate fact, so ready means both. This chassis carries
  # far less instrumentation than a Scout or a PX4 airframe, and the IMU is the
  # only stream it publishes continuously without being commanded --
  # command.velocity merely echoes an operator intent and is silent on an idle
  # robot, so it can never stand in for liveness.
  online_conditions:
    - channel_id: state.imu
      maximum_age_ms: 1000
  operational_ready_conditions:
    - channel_id: vrpn.position
      maximum_age_ms: 1000
channels:
  - id: vrpn.position
    kind: stream_out
    output_message_id: 2001
    processor: mecanum-ugv.vrpn-pose
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global

  - id: vrpn.velocity
    kind: stream_out
    output_message_id: 2002
    processor: mecanum-ugv.vrpn-velocity
    output_rate_hz: 10
    inputs:
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: vrpn.speed
    kind: stream_out
    output_message_id: 2006
    processor: mecanum-ugv.vrpn-speed
    output_rate_hz: 10
    inputs:
      pose:
        name: vrpn_client_node/{mocap_rigid_body}/pose
        type: geometry_msgs/PoseStamped
        scope: global
      velocity:
        name: vrpn_client_node/{mocap_rigid_body}/twist
        type: geometry_msgs/TwistStamped
        scope: global

  - id: command.velocity
    kind: stream_out
    output_message_id: 2002
    processor: mecanum-ugv.velocity-command-observation
    output_rate_hz: 10
    inputs:
      command:
        name: cmd_vel
        type: geometry_msgs/Twist

  - id: state.imu
    kind: stream_out
    output_message_id: 2003
    processor: mecanum-ugv.imu-estimate
    output_rate_hz: 10
    inputs:
      imu:
        name: imu
        type: sensor_msgs/Imu

  - id: operation.motion-intent
    kind: operation
    operation_id: set-motion-intent
    input_message_id: 3205
    output_message_id: 1
    processor: mecanum-ugv.set-motion-intent
    operation_contract:
      side_effect: idempotent
      idempotency: required
      cancellation_supported: false
      deadline_required: true
    output:
      name: cmd_vel
      type: geometry_msgs/Twist
    policy:
      timeout_ms: 1000

  - id: diagnostic.channel-health
    kind: stream_out
    output_message_id: 2010
    processor: common.channel-health
    output_rate_hz: 10
    observes:
      - vrpn.position
      - vrpn.velocity
      - vrpn.speed
      - state.imu
      - command.velocity
