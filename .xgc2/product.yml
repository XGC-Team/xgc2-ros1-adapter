schema: xgc2.product.v1
id: xgc2-ros1-adapters
name: XGC2 ROS1 Robot Adapters
version: 0.5.0-20
kind: ros1-apt
summary: Robot-owned ROS1 semantic adapters plus the separate read-only Mocap Rotor onboard Zenoh forwarder.
groups:
- ros1
- communication
- adapter
- robot
ros:
  distro: noetic
  workspace: catkin
  packages:
  - xgc_px4_multirotor_ros1_adapter
  - xgc_scout_mini_ros1_adapter
  - xgc_mecanum_ugv_ros1_adapter
  - xgc_unitree_b2_ros1_adapter
  - xgc_mocap_rotor_ros1_adapter
  - xgc_mocap_rotor_zenoh_forwarder
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-px4-multirotor-adapter
  - ros-noetic-xgc2-scout-mini-adapter
  - ros-noetic-xgc2-mecanum-ugv-adapter
  - ros-noetic-xgc2-unitree-b2-adapter
  - ros-noetic-xgc2-mocap-rotor-adapter
  packages:
  - ros-noetic-xgc2-px4-multirotor-adapter
  - ros-noetic-xgc2-scout-mini-adapter
  - ros-noetic-xgc2-mecanum-ugv-adapter
  - ros-noetic-xgc2-unitree-b2-adapter
  - ros-noetic-xgc2-mocap-rotor-adapter
  - ros-noetic-xgc2-mocap-rotor-forwarder
  depends:
  - libxgc2-adapter-runtime-client2
  - ros-noetic-diagnostic-msgs
  - ros-noetic-geometry-msgs
  - ros-noetic-mavros-msgs
  - python3-jsonschema
  - python3-yaml
  - ros-noetic-roscpp
  - ros-noetic-nav-msgs
  - ros-noetic-scout-msgs
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
  - ros-noetic-tf2-ros
usage:
  install: |
    sudo apt update
    sudo apt install \
      ros-noetic-xgc2-px4-multirotor-adapter \
      ros-noetic-xgc2-scout-mini-adapter \
      ros-noetic-xgc2-mecanum-ugv-adapter \
      ros-noetic-xgc2-unitree-b2-adapter \
      ros-noetic-xgc2-mocap-rotor-adapter
  smoke_test: |
    rospack find xgc_px4_multirotor_ros1_adapter
    rospack find xgc_scout_mini_ros1_adapter
    rospack find xgc_mecanum_ugv_ros1_adapter
    rospack find xgc_unitree_b2_ros1_adapter
    rospack find xgc_mocap_rotor_ros1_adapter
    rospack find xgc_mocap_rotor_zenoh_forwarder
    test -x /opt/ros/noetic/lib/xgc_px4_multirotor_ros1_adapter/xgc_px4_multirotor_ros1_adapter_node
    test -x /opt/ros/noetic/lib/xgc_px4_multirotor_ros1_adapter/xgc_px4_multirotor_ros1_adapter_service_helper
    test -x /opt/ros/noetic/lib/xgc_scout_mini_ros1_adapter/xgc_scout_mini_ros1_adapter_node
    test -x /opt/ros/noetic/lib/xgc_mecanum_ugv_ros1_adapter/xgc_mecanum_ugv_ros1_adapter_node
    test -x /opt/ros/noetic/lib/xgc_unitree_b2_ros1_adapter/xgc_unitree_b2_ros1_adapter_node
    test -x /opt/ros/noetic/lib/xgc_mocap_rotor_ros1_adapter/xgc_mocap_rotor_ros1_adapter_node
    test -x /opt/ros/noetic/lib/xgc_mocap_rotor_zenoh_forwarder/xgc_mocap_rotor_zenoh_forwarder_node
    test -f /opt/ros/noetic/share/xgc_px4_multirotor_ros1_adapter/profiles/ros1/px4-multirotor-ros1-v7.yaml
    test -f /opt/ros/noetic/share/xgc_scout_mini_ros1_adapter/profiles/ros1/scout-mini-ros1-v6.yaml
    test -f /opt/ros/noetic/share/xgc_mecanum_ugv_ros1_adapter/profiles/ros1/mecanum-ugv-ros1-v3.yaml
    test -f /opt/ros/noetic/share/xgc_unitree_b2_ros1_adapter/profiles/ros1/unitree-b2-v1.yaml
    test -f /opt/ros/noetic/share/xgc_mocap_rotor_ros1_adapter/profiles/ros1/mocap-rotor-ros1-v1.yaml
    test -f /usr/share/xgc2/adapter-definitions/xgc2-px4-multirotor-ros1-adapter.json
    test -f /usr/share/xgc2/adapter-definitions/xgc2-scout-mini-ros1-adapter.json
    test -f /usr/share/xgc2/adapter-definitions/xgc2-mecanum-ugv-ros1-adapter.json
    test -f /usr/share/xgc2/adapter-definitions/xgc2-unitree-b2-ros1-adapter.json
    test -f /usr/share/xgc2/adapter-definitions/xgc2-mocap-rotor-ros1-adapter.json
    test -f /usr/share/xgc2/robot-adapter-profiles/xgc2-px4-multirotor-ros1-adapter.json
    test -f /usr/share/xgc2/robot-adapter-profiles/xgc2-scout-mini-ros1-adapter.json
    test -f /usr/share/xgc2/robot-adapter-profiles/xgc2-mecanum-ugv-ros1-adapter.json
    test -f /usr/share/xgc2/robot-adapter-profiles/xgc2-unitree-b2-ros1-adapter.json
    test -f /usr/share/xgc2/robot-adapter-profiles/xgc2-mocap-rotor-ros1-adapter.json
    test -f /usr/share/xgc2/process-definitions/xgc2-mocap-rotor-link.json
  notes: |
    Install ros-noetic-xgc2-mocap-rotor-forwarder only on the Mocap Rotor
    Orin NX, never on FS150 or the ground Core.
    Each robot Adapter is a domain-specific Adapter Runtime application. Core
    resolves its provider definition from the installed robot profile catalog.
    Unitree B2 and Mocap Rotor providers are telemetry-only and directly own
    wire decode, semantic projection, freshness, and ROS1/TF recovery. Mocap
    Rotor uses its own onboard Zenoh/MAVROS computer boundary; its Forwarder is
    a separate package that only subscribes to explicitly mapped topics. The
    ground package neither starts MAVROS nor shares the FS150 ROS graph. Zenoh
    C 1.9.0 is built from the pinned upstream source on Focal and linked
    statically in both Mocap Rotor packages.
ownership:
  paths:
  - /opt/ros/noetic/share/xgc_px4_multirotor_ros1_adapter
  - /opt/ros/noetic/lib/xgc_px4_multirotor_ros1_adapter/xgc_px4_multirotor_ros1_adapter_node
  - /opt/ros/noetic/lib/xgc_px4_multirotor_ros1_adapter/xgc_px4_multirotor_ros1_adapter_service_helper
  - /opt/ros/noetic/share/xgc_scout_mini_ros1_adapter
  - /opt/ros/noetic/lib/xgc_scout_mini_ros1_adapter/xgc_scout_mini_ros1_adapter_node
  - /opt/ros/noetic/share/xgc_mecanum_ugv_ros1_adapter
  - /opt/ros/noetic/lib/xgc_mecanum_ugv_ros1_adapter/xgc_mecanum_ugv_ros1_adapter_node
  - /opt/ros/noetic/share/xgc_unitree_b2_ros1_adapter
  - /opt/ros/noetic/lib/xgc_unitree_b2_ros1_adapter/xgc_unitree_b2_ros1_adapter_node
  - /opt/ros/noetic/share/xgc_mocap_rotor_ros1_adapter
  - /opt/ros/noetic/lib/xgc_mocap_rotor_ros1_adapter/xgc_mocap_rotor_ros1_adapter_node
  - /opt/ros/noetic/share/xgc_mocap_rotor_zenoh_forwarder
  - /opt/ros/noetic/lib/xgc_mocap_rotor_zenoh_forwarder/xgc_mocap_rotor_zenoh_forwarder_node
  - /usr/share/xgc2/adapter-definitions/xgc2-px4-multirotor-ros1-adapter.json
  - /usr/share/xgc2/adapter-definitions/xgc2-scout-mini-ros1-adapter.json
  - /usr/share/xgc2/adapter-definitions/xgc2-mecanum-ugv-ros1-adapter.json
  - /usr/share/xgc2/adapter-definitions/xgc2-unitree-b2-ros1-adapter.json
  - /usr/share/xgc2/adapter-definitions/xgc2-mocap-rotor-ros1-adapter.json
  - /usr/share/xgc2/robot-adapter-profiles/xgc2-px4-multirotor-ros1-adapter.json
  - /usr/share/xgc2/robot-adapter-profiles/xgc2-scout-mini-ros1-adapter.json
  - /usr/share/xgc2/robot-adapter-profiles/xgc2-mecanum-ugv-ros1-adapter.json
  - /usr/share/xgc2/robot-adapter-profiles/xgc2-unitree-b2-ros1-adapter.json
  - /usr/share/xgc2/robot-adapter-profiles/xgc2-mocap-rotor-ros1-adapter.json
  - /usr/share/xgc2/process-definitions/xgc2-mocap-rotor-link.json
release:
  repository: lxk36/xgc2-ros1-adapter
  ref: master
  workflow: release.yml
  ci_workflow: ci.yml
  requires:
  - libxgc2-adapter-runtime-client-dev
  - xgc2-protobuf
  dependency_policy:
    libxgc2-adapter-runtime-client-dev: rebuild
    xgc2-protobuf: rebuild
    xgc2-scout-msgs: rebuild
  apt_versions:
    focal: 0.5.0-20