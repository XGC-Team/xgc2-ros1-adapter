schema: xgc2.product.v1
id: xgc2-ros1-adapter
name: XGC2 ROS1 Adapter
version: 0.1.0-3
kind: ros1-apt
summary: ROS1 semantic adapter for XGC2 Go Core robot state and command bridging.
ros:
  distro: noetic
  workspace: catkin
  packages:
  - xgc_ros1_adapter
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-ros1-adapter
  packages:
  - ros-noetic-xgc2-ros1-adapter
  depends:
  - libgrpc++1
  - libprotobuf17
  - libre2-5
  - ros-noetic-geometry-msgs
  - ros-noetic-mavros-msgs
  - ros-noetic-roscpp
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
  - ros-noetic-tf2
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-ros1-adapter

    '
  smoke_test: 'rospack find xgc_ros1_adapter

    test -x /opt/ros/noetic/lib/xgc_ros1_adapter/xgc_ros1_adapter_node

    '
  notes: 'The runtime process is managed by XGC Go Core as ros1-adapter and connects

    to the AdapterIngress gRPC UDS, defaulting to /tmp/xgc2/adapter-ingress.sock.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/xgc_ros1_adapter
  - /opt/ros/noetic/include/xgc_ros1_adapter
  - /opt/ros/noetic/lib/xgc_ros1_adapter/xgc_ros1_adapter_node
